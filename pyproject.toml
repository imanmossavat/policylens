[project]
name = "plens"
version = "0.1.0"
description = "Run pretrained robot policies, record their internals, analyze failures."
requires-python = ">=3.12"
dependencies = [
    "lerobot[pusht,diffusion]>=0.6,<0.7",
    "numpy",
    "imageio[ffmpeg]",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: runs a real (random-weight) policy in the real env; slower"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
